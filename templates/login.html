<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — EUIBA AI Safety Harness</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>EUIBA AI Safety Harness</h1>
    <p class="lede small">Sign in with your institutional email address.</p>

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="post" action="/login" class="stack" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username"
               required maxlength="254" autofocus>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required maxlength="1024">
      </div>
      <button type="submit">Sign in</button>
    </form>

    <p class="auth-foot">No account yet? <a href="/register">Register</a></p>
  </div>
</div>
</body>
</html>
