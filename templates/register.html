<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — EUIBA AI Safety Harness</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>Register</h1>
    <p class="lede small">
      Your email address is your username. Choose your institution, body or agency from the list.
      {% if domain_allowlist %}
        Registration is limited to: {{ domain_allowlist|join(', ') }}.
      {% endif %}
    </p>

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="post" action="/register" class="stack" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div>
        <label for="euiba_id">Institution, body or agency</label>
        <select id="euiba_id" name="euiba_id" required>
          <option value="">Select…</option>
          {% for group in groups %}
            <optgroup label="{{ group.name }}">
              {% for entry in group.entries %}
                <option value="{{ entry.id }}"
                  {% if form.euiba_id == entry.id %}selected{% endif %}>{{ entry.name }}</option>
              {% endfor %}
            </optgroup>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="email">Email address <span class="hint">This is your username.</span></label>
        <input id="email" name="email" type="email" autocomplete="username"
               required maxlength="254" value="{{ form.email|default('') }}">
      </div>

      <div>
        <label for="display_name">Name <span class="hint">Optional.</span></label>
        <input id="display_name" name="display_name" type="text" autocomplete="name"
               maxlength="120" value="{{ form.display_name|default('') }}">
      </div>

      <div>
        <label for="password">Password
          <span class="hint">At least {{ min_length }} characters. Length matters more than symbols —
          a passphrase is a good choice.</span>
        </label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               required minlength="{{ min_length }}" maxlength="1024">
      </div>

      <div>
        <label for="password_confirm">Confirm password</label>
        <input id="password_confirm" name="password_confirm" type="password"
               autocomplete="new-password" required minlength="{{ min_length }}" maxlength="1024">
      </div>

      <button type="submit">Create account</button>
    </form>

    <p class="auth-foot">Already registered? <a href="/login">Sign in</a></p>
  </div>
</div>
</body>
</html>
