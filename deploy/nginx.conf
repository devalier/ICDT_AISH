# Alternative to Caddy, for a site that already runs nginx. Certificates are
# assumed to be managed by certbot or equivalent.

server {
    listen 80;
    server_name aish.devalier.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aish.devalier.com;

    ssl_certificate     /etc/letsencrypt/live/aish.devalier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aish.devalier.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_tokens off;

    # Sessions carry evidence pages; keep bodies small and uploads impossible.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Overwrite rather than append: the application trusts the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }
}
